---
- name: Configure Fedora desktop
  hosts: local
  # facts required: roles use ansible_facts['user_dir']
  roles:
    # Prerequisites (run before the roles below)
    - flatpak
    - git
    - zsh

    # Development
    - codex
    - docker
    - fnm
    - godot
    - golang
    - opentofu
    - rust
    - sqlitebrowser
    - uv
    - vscode

    # Internet and productivity
    - brave
    - obsidian
    - qbittorrent
    - telegram

    # Graphics and media
    - blender
    - gimp
    - kooha
    - vlc

    # Security and privacy
    - keepassxc
    - mullvad
    - opensnitch

    # System utilities
    - bleachbit
    - fastfetch
    - solaar
