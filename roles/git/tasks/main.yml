---
- name: Install git
  become: true
  ansible.builtin.dnf5:
    name: git
    state: present

- name: Configure explicitly provided Git identity
  community.general.git_config:
    scope: file
    file: "{{ ansible_facts['user_dir'] }}/.gitconfig"
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - name: user.name
      value: "{{ git_user_name }}"
    - name: user.email
      value: "{{ git_user_email }}"
  when: item.value | length > 0
  loop_control:
    label: "{{ item.name }}"
