---
- name: Import Docker GPG key
  become: true
  ansible.builtin.rpm_key:
    key: https://download.docker.com/linux/fedora/gpg
    state: present

- name: Add Docker repository
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: "0644"
  register: docker_repo

- name: Install Docker Engine
  become: true
  ansible.builtin.dnf5:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_repo.changed }}"

# The default json-file driver never rotates, so container logs grow until the
# disk fills. The local driver rotates and compresses out of the box.
- name: Configure the Docker daemon
  become: true
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker

- name: Enable Docker services
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - docker.service
    - containerd.service

# Membership in the docker group grants root-equivalent access to the host,
# but is what lets the docker CLI run without sudo. Takes effect on next login.
- name: Add user to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
