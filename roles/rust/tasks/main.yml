---
# Installed via rustup as recommended by https://rust-lang.org/tools/install/.
# Upgrades are handled by "rustup update", not by this role.
- name: Install Rust dependencies
  become: true
  ansible.builtin.dnf5:
    name: gcc
    state: present

- name: Install rustup
  ansible.builtin.shell:
    cmd: >-
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
      | sh -s -- -y --no-modify-path
    creates: "{{ rust_cargo_home }}/bin/rustup"
  environment:
    CARGO_HOME: "{{ rust_cargo_home }}"

- name: Deploy Rust shell integration
  ansible.builtin.copy:
    src: rust.zsh
    dest: "{{ rust_zsh_custom_dir }}/rust.zsh"
    mode: "0644"

- name: Create zsh completions directory
  ansible.builtin.file:
    path: "{{ rust_completions_dir }}"
    state: directory
    mode: "0755"

- name: Generate zsh completions
  ansible.builtin.command: "{{ rust_cargo_home }}/bin/rustup completions zsh {{ item }}"
  register: rust_completions
  changed_when: false
  failed_when: false
  check_mode: false
  loop:
    - rustup
    - cargo

- name: Deploy zsh completions
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "{{ rust_completions_dir }}/_{{ item.item }}"
    mode: "0644"
  when: item.rc == 0
  loop: "{{ rust_completions.results }}"
  loop_control:
    label: "{{ item.item }}"
  diff: false
