---
- name: Install zsh
  become: true
  ansible.builtin.dnf5:
    name: zsh
    state: present

- name: Clone oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh"
    depth: 1
    version: master
    update: false

- name: Clone custom plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
    update: false
  loop:
    - name: zsh-autosuggestions
      repo: https://github.com/zsh-users/zsh-autosuggestions.git
    - name: fast-syntax-highlighting
      repo: https://github.com/zdharma-continuum/fast-syntax-highlighting.git
  loop_control:
    label: "{{ item.name }}"

- name: Deploy .zshrc
  ansible.builtin.copy:
    src: zshrc
    dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    mode: "0644"

- name: Set zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh