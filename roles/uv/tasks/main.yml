---
# Upgrades are handled by "uv self update", not by this role.
- name: Install uv
  ansible.builtin.shell:
    cmd: curl -LsSf https://astral.sh/uv/install.sh | sh
    creates: "{{ uv_install_dir }}/uv"
  environment:
    UV_INSTALL_DIR: "{{ uv_install_dir }}"
    # The zsh role owns .zshrc, so keep the installer out of it.
    UV_NO_MODIFY_PATH: "1"

- name: Create zsh completions directory
  ansible.builtin.file:
    path: "{{ uv_completions_dir }}"
    state: directory
    mode: "0755"

- name: Generate zsh completions
  ansible.builtin.command: "{{ item.command }}"
  register: uv_completions
  changed_when: false
  failed_when: false
  check_mode: false
  loop:
    - name: uv
      command: "{{ uv_install_dir }}/uv generate-shell-completion zsh"
    - name: uvx
      command: "{{ uv_install_dir }}/uvx --generate-shell-completion zsh"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy zsh completions
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "{{ uv_completions_dir }}/_{{ item.item.name }}"
    mode: "0644"
  when: item.rc == 0
  loop: "{{ uv_completions.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  diff: false
