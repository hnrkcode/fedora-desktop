---
- name: Import Mullvad GPG key
  become: true
  ansible.builtin.rpm_key:
    key: https://repository.mullvad.net/rpm/mullvad-keyring.asc
    state: present

- name: Add Mullvad VPN repository
  become: true
  ansible.builtin.get_url:
    url: https://repository.mullvad.net/rpm/stable/mullvad.repo
    dest: /etc/yum.repos.d/mullvad.repo
    owner: root
    group: root
    mode: "0644"
  register: mullvad_repo

- name: Install Mullvad VPN
  become: true
  ansible.builtin.dnf5:
    name: mullvad-vpn
    state: present
    update_cache: "{{ mullvad_repo.changed }}"

- name: Create autostart directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/autostart"
    state: directory
    mode: "0755"

# Symlink to the packaged desktop file, which is what the GUI's
# "Launch app on start-up" setting creates. Only autostarts the GUI,
# mullvad-daemon.service is enabled by the package.
- name: Autostart Mullvad VPN
  ansible.builtin.file:
    src: /usr/share/applications/mullvad-vpn.desktop
    dest: "{{ ansible_facts['user_dir'] }}/.config/autostart/mullvad-vpn.desktop"
    state: link
